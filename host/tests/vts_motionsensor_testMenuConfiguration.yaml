# vts_motionsensor_testMenuConfiguration.yaml
motionsensor:
    description: "motion sensor testing profile / menu system for UT"
    test:
        artifacts:
          - "../../build/bin/vts-motionsensor.tar.gz"
        execute: "./run.sh"
        type: UT-C
        suites:
            0:
                name: "VTS_L1_MOTIONSENSOR"
                tests:
                    - "getMotionSensorIds_pos"
                    - "getMotionSensor_pos"
                    - "getMotionSensor_neg"
                    - "getCapabilities_pos"
                    - "getState_pos"
                    - "open_pos"
                    - "open_neg"
                    - "close_neg"
                    - "registerEventListener_pos"
                    - "registerEventListener_neg"
                    - "unregisterEventListener_neg"
                    - "start_pos"
                    - "start_neg"
                    - "stop_neg"
                    - "getStartConfig_pos"
                    - "getStartConfig_neg"
                    - "getSensitivity_pos"
                    - "setSensitivity_pos"
                    - "setSensitivity_neg"
                    - "isAutonomousDuringDeepSleepEnabled_pos"
                    - "setAutonomousDuringDeepSleep_pos"
                    - "setAutonomousDuringDeepSleep_neg"
                    - "setActiveWindows_pos"
                    - "setActiveWindows_neg"
                    - "getActiveWindows_pos"
                    - "clearActiveWindows_pos"
                    - "clearActiveWindows_neg"
            1:
                name: "VTS_L2_MOTIONSENSOR"
                tests:
                    - "StateTransitions"
                    - "ConfigurationMethodsRequireStopped"
            2:
                name: "VTS_L3_MOTIONSENSOR"
                tests:
                    - "EventDetection"
                    - "ActiveWindowBehavior"
                    - "NoMotionTimerReset"
