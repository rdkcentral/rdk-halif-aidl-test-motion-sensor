# vts_motionsensor_testMenuConfiguration.yaml
motionsensor:
    description: "motion sensor testing profile / menu system for UT"
    test:
        artifacts:
          - "../../build/bin/vts-motionsensor.tar.gz"
        execute: "./run.sh"
        type: UT-C
        suites:
            0:
                name: "VTS_L1_MOTIONSENSOR"
                tests:
                    - "GetMotionSensorIds_Success"
                    - "GetMotionSensor_Positive"
                    - "GetMotionSensor_Negative"
                    - "GetCapabilities_Positive"
                    - "GetState_Positive"
                    - "Open_Close_Positive"
                    - "Open_Negative_NullListener"
                    - "Open_Negative_AlreadyOpen"
                    - "Close_Negative_NullController"
                    - "Close_Negative_WrongController"
                    - "Register_UnRegisterEventListener_Positive"
                    - "RegisterEventListener_Negative_AlreadyRegistered"
                    - "UnregisterEventListener_Negative_NotRegistered"
                    - "Start_Stop_Positive"
                    - "Start_Negative_AlreadyStarted"
                    - "Start_Negative_InvalidConfig"
                    - "Stop_Negative_AlreadyStopped"
                    - "GetStartConfig_Positive"
                    - "GetStartConfig_Negative_Stopped"
                    - "GetSensitivity_Positive"
                    - "SetSensitivity_Positive_MinMaxRange"
                    - "SetSensitivity_OutOfRange"
                    - "SetSensitivity_Negative_WhileStarted"
                    - "GetAutonomous_Positive"
                    - "SetAutonomous_Positive"
                    - "SetAutonomous_Negative_WhileStarted"
                    - "SetActiveWindows_Positive"
                    - "SetActiveWindows_Negative_OutOfRange"
                    - "SetActiveWindows_Negative_WhileStarted"
                    - "GetActiveWindows_Positive"
                    - "ClearActiveWindows_Positive"
                    - "ClearActiveWindows_Negative_WhileStarted"
            1:
                name: "VTS_L2_MOTIONSENSOR"
                tests:
                    - "StateTransitions"
                    - "ConfigurationMethodsRequireStopped"
            2:
                name: "VTS_L3_MOTIONSENSOR"
                tests:
                    - "MotionEventDetection"
                    - "NoMotionEventDetection"
                    - "ActiveWindowBehavior"
                    - "DeepSleepAutonomy"
