motionsensor:
  description: "Motion Sensor L1, L2 and L3 test setup"
  restart_required: False
  test_suites:
    ######################################
    # Entry to run all test cases
    ######################################
    #  - name: "VTS_L1_MOTIONSENSOR"
    #    test_cases:
    #      - all
    #######################################
    # Entries to run individual test cases
    #######################################
    - name: "VTS_L1_MOTIONSENSOR"
      test_cases:
        - "getMotionSensorIds_pos"
        - "getMotionSensor_pos"
        - "getMotionSensor_neg"
        - "getCapabilities_pos"
        - "getState_pos"
        - "open_pos"
        - "open_neg"
        - "close_neg"
        - "registerEventListener_pos"
        - "registerEventListener_neg"
        - "unregisterEventListener_neg"
        - "start_pos"
        - "start_neg"
        - "stop_neg"
        - "getStartConfig_pos"
        - "getStartConfig_neg"
        - "getSensitivity_pos"
        - "setSensitivity_pos"
        - "setSensitivity_neg"
        - "isAutonomousDuringDeepSleepEnabled_pos"
        - "setAutonomousDuringDeepSleep_pos"
        - "setAutonomousDuringDeepSleep_neg"
        - "setActiveWindows_pos"
        - "setActiveWindows_neg"
        - "getActiveWindows_pos"
        - "clearActiveWindows_pos"
        - "clearActiveWindows_neg"
    - name: "VTS_L2_MOTIONSENSOR"
      test_cases:
        - "StateTransitions"
        - "ConfigurationMethodsRequireStopped"
    - name: "VTS_L3_MOTIONSENSOR"
      test_cases:
        - "EventDetection"
        - "ActiveWindowBehavior"
        - "NoMotionTimerReset"
