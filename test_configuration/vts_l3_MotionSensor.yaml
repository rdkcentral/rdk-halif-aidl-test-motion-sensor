motionsensor:
  L3:
    EventDetection:
      sensor_index: 0
      # operational_mode is hardcoded in the C++ tests (MOTION / NO_MOTION);
      # this field is for documentation only.
      operational_mode: "MOTION"
      no_motion_seconds: 5
      active_start_seconds: 0
      active_stop_seconds: 0
      event_timeout_ms: 15000
      # Overwritten per run by Python for DeepSleepAutonomy: idle seconds before
      # the vcomponent enters deep sleep (matches --deep-sleep-duration CLI arg).
      # event_timeout_ms is also overwritten to (deep_sleep_duration_seconds+15)*1000.
      deep_sleep_duration_seconds: 60
      # maximum number of events to collect (test passes if at least 1 arrives).
      max_expected_events: 5
      # Overwritten per run by Python: true = autonomy ON, false = autonomy OFF.
      autonomy_enabled: true
      # Overwritten per run by Python (mirrors autonomy_enabled):
      # true  = probe trigger must arrive  (device woke up after motion).
      # false = probe trigger must be gated (device stayed asleep).
      expect_wakeup: true
      # active_windows is intentionally empty here.
      # The ActiveWindowBehavior Python test defines the 10 window scenarios
      # as a hardcoded constant and patches the scalar fields above per-iteration.
      # MotionEventDetection and NoMotionEventDetection do not use this list.
      active_windows: []
